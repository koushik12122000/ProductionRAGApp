[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "koushikpesaru", email = "k.pesaru@u-know.ai" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "inngest>=0.5.19",
    "llama-index-core>=0.14.23",
    "llama-index-readers-file>=0.6.0",
    "openai>=3.1.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "streamlit>=1.61.1",
    "uvicorn>=0.52.3",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
